name: Renovate

on:
  workflow_dispatch:
    schedule:
      - cron: "0 9 * * 1"

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Renovate bot
        uses: renovatebot/github-action@v46.3.3
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
